[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-game"
version = "2.0.0"
description = "A Linux command quiz for the terminal, with commentary from your favourite TV universes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
linux-game = "terminal_challenge.cli:main"

[tool.setuptools.packages.find]
include = ["terminal_challenge*"]

[tool.setuptools.package-data]
terminal_challenge = ["data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
